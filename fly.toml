app = 'murrayserver'
primary_region = 'syd'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[deploy]
  strategy = 'immediate'
  max_unavailable = 0

[[services]]
  [services.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000
